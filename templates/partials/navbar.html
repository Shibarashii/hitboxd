{% load static %}
<nav class="flex justify-evenly items-center gap-5 bg-gray-800 text-brand-lemon-200 text-center text-xs md:text-base lg:text-lg px-2">
  <a class="flex items-center" href="{% url 'homepage' %}">
    <img src="{% static 'icons/favicon.png' %}"
         alt="icon"
         class="h-12 p-2 md:h-16 lg:h-18 lg:p-2.5">
    <h1 class="font-bold">HITBOXD</h1>
  </a>
  <div>
    <ul class="flex items-center gap-2.5 md:gap-6 lg:gap-8">
      <!-- Check if user is authenticated -->
      {% if user.is_authenticated %}
        <details class="relative p-2">
          <summary class="cursor-pointer font-bold">{{ user.username|upper }}</summary>
          <ul class="absolute left-0 z-10 md:mt-2 flex flex-col w-full bg-gray-800 gap-1 shadow-md text-center md:[&_li]:text-base [&_li]:hover:bg-gray-600 [&_li_a]:py-3 [&_li_a]:block">
            <hr>
            <li> <a href="">Profile </a></li>
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="block w-full md:py-3 cursor-pointer">Logout</button>
              </form>
            </li>
          </ul>
        </details>
      {% else %}
        <li>
          <a href="{% url 'login' %}">Log in</a>
        </li>
        <li>
          <a href="{% url 'registration' %}">Create account</a>
        </li>
      {% endif %}
      <li>
        <a href="{% url 'search-games' %}">Games</a>
      </li>
      <li>
        <a href="">Members</a>
      </li>
      <li>
        <form method="get" action="{% url 'search-games' %}" role="search">
          <div class="relative">
            <input type="search"
                   name="q"
                   value="{{ request.GET.q }}"
                   placeholder="Search games.."
                   aria-label="Search games"
                   class="w-28 bg-gray-600 pl-9 text-brand-lemon-200 md:w-56">
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-gray-400"
                 aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </div>
        </form>
      </li>
    </ul>
  </div>
</nav>
