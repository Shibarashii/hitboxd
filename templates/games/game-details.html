{% extends "base.html" %}

{% block page_title %} {{ game.name }} {% endblock %}

{% block content %}

<main> 
<h1> 
  {% if game %}
  <h1> {{game.name}}</h1>
  <p> {{game.summary}} </p>
  <p> {{game.rating}} </p>

  <img src="{{game.cover_url}}" alt="{{game.name}} cover">


  {% else %}

  <h1> Game not found</h1>

  {% endif %}

</h1>
</main>

{% endblock %}
